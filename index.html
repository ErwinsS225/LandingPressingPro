<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f2" />
    <meta
      name="description"
      content="PressIvoire aide les pressings ivoiriens à suivre commandes, clients et paiements depuis leur téléphone."
    />
    <title>PressIvoire — Votre pressing, mieux organisé</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Applique le thème avant le premier rendu pour éviter le clignotement
      // clair → sombre. Même logique que src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("pressivoire:theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
